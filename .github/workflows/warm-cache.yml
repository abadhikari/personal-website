name: Warm CloudFront Cache

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    concurrency:
      group: warm-cache
      cancel-in-progress: false
    env:
      BASE_URL: https://api.abhinnaadhikari.com
      ORIGIN_HEADER: https://abhinnaadhikari.com
      URLS: |
        /v1/reviews?limit=10
        /v1/stacks?stackLimit=10&startTimestamp=0&endTimestamp=9999999999999
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run warm cache script
        run: ./scripts/warm-cache.sh
